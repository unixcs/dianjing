# dianjing v2 反代片段 —— 追加到 /etc/nginx/sites-available/wx.gxwqb.cn.production.conf
# 的 443 server 块内（root yoshop 那份），reload 生效。
# 与老 PHP 并行：/v2/* 全部走新 Go 服务，其余路径不受影响。
#
#   location ^~ /v2/ {
#       include /etc/nginx/snippets/dianjing-v2.conf;
#   }
#
# 小程序 request 合法域名单 wx.gxwqb.cn 不变；/v2/api/** 与 /v2/admin、/uploads/** 均由 Go 服务提供。

proxy_pass http://127.0.0.1:8096;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 30s;
# /wx/msg 是微信消息推送入口，同样走这条反代（Go 服务内部路由已区分）。
